[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-journal"
version = "1.0.0"
description = "Paper-trading journal: FIFO P&L for long and short positions, performance stats, price data, and an SMA backtest."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Terry Shim" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "hypothesis==6.168.0", "ruff==0.16.8", "mypy==2.3.1"]

[project.scripts]
tj = "trading_journal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=trading_journal --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
omit = ["src/trading_journal/__main__.py"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
