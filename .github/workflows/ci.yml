name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests (fails under 95% coverage)
        run: pytest
      - name: CLI smoke test on sample data
        run: |
          tj --journal examples/sample_trades.csv positions --mark SPY=600 --mark NVDA=130
          tj --journal examples/sample_trades.csv stats
          tj backtest examples/sample_prices.csv --fee-bps 5

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and install it in a clean environment
        run: |
          pip install build
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/tj --version
