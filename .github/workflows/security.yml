name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full git history for secrets
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  env-files:
    name: No committed .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if any .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$'; then
            echo "A .env file is committed. Remove it, rotate the keys inside, and add it to .gitignore."
            exit 1
          fi

  no-emoji:
    name: No emojis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_no_emoji.py
